version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: annsarthi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - annsarthi-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: annsarthi-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
    networks:
      - annsarthi-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: annsarthi-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/annsarthi
      - JWT_SECRET=annsarthi_production_secret_key_sih26234_jwt_auth_indore
      - JWT_REFRESH_SECRET=annsarthi_production_refresh_secret_key_sih26234
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost
      - DEMO_MODE=true
    volumes:
      - server_uploads:/app/uploads
    networks:
      - annsarthi-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: annsarthi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - annsarthi-network

networks:
  annsarthi-network:
    driver: bridge

volumes:
  mongo_data:
  server_uploads:
